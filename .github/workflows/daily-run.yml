# Daily Stock Mover run: engine + checked briefing, uploaded to Vercel Blob.
# Never commits to git: the job only has read access to the repo.
name: daily-run

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency: daily-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install engine
        working-directory: engine
        run: uv sync --frozen

      - name: Run engine
        working-directory: engine
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_MODEL: ${{ secrets.SARVAM_MODEL }}
        run: uv run stock-mover run --out ../out/latest.json --trigger ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Upload run to Vercel Blob
        working-directory: apps/web
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/upload-run.mjs ../../out/latest.json
