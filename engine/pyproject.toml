[project]
name = "stock-mover"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arkadipta Mojumder", email = "arkadiptamojumder14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
]

[project.scripts]
stock-mover = "stock_mover.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
]
